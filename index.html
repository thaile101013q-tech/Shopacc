<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME SHOP PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    background: #050505;
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
}

.logo {
    color: cyan;
    font-size: 24px;
}

.nav a {
    margin-left: 20px;
    text-decoration: none;
    color: white;
}

.nav a:hover {
    color: cyan;
}

/* HERO */
.hero {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(180deg, #000, #111);
}

.hero h1 {
    font-size: 60px;
    color: cyan;
}

.btn {
    padding: 12px 30px;
    background: cyan;
    border: none;
    cursor: pointer;
}

/* SEARCH */
.search {
    text-align: center;
    margin: 20px;
}

.search input {
    padding: 10px;
    width: 250px;
    background: #111;
    border: none;
    color: white;
}

/* PRODUCTS */
.products {
    padding: 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 20px;
}

.card {
    background: #111;
    padding: 15px;
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 0 20px cyan;
}

.price {
    color: cyan;
}

/* LOGIN */
.login-box {
    display: none;
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #111;
    padding: 20px;
    border-radius: 10px;
}

input {
    margin: 5px;
    padding: 10px;
    width: 90%;
}

/* ADMIN */
.admin {
    display: none;
    padding: 20px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">GAME SHOP PRO</div>
    <div class="nav">
        <a href="#">Home</a>
        <a href="#" onclick="showLogin()">Login</a>
        <a href="#" onclick="showAdmin()">Admin</a>
    </div>
</div>

<section class="hero">
    <div>
        <h1>SHOP GAME FUTURISTIC</h1>
        <button class="btn">Mua ngay</button>
    </div>
</section>

<div class="search">
    <input type="text" id="search" placeholder="Tìm sản phẩm..." onkeyup="searchProduct()">
</div>

<section class="products">
    <div class="grid" id="productList"></div>
</section>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
    <h3>Đăng nhập</h3>
    <input id="user" placeholder="User">
    <input id="pass" placeholder="Pass">
    <button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">
    <h2>Admin Panel</h2>
    <input id="name" placeholder="Tên sản phẩm">
    <input id="price" placeholder="Giá">
    <button onclick="addProduct()">Thêm</button>
</div>

<div class="footer">© 2026 GAME SHOP</div>

<script>
let products = [
    {name:"Acc Free Fire", price:100000},
    {name:"Acc Roblox", price:200000},
    {name:"Acc Valorant", price:300000}
];

function render(){
    let html = "";
    products.forEach(p=>{
        html += `
        <div class="card">
            <h3>${p.name}</h3>
            <p class="price">${p.price}đ</p>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}
render();

function searchProduct(){
    let key = document.getElementById("search").value.toLowerCase();
    let filter = products.filter(p => p.name.toLowerCase().includes(key));
    let html="";
    filter.forEach(p=>{
        html += `<div class="card"><h3>${p.name}</h3><p class="price">${p.price}đ</p></div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function showLogin(){
    document.getElementById("loginBox").style.display="block";
}

function login(){
    alert("Login thành công (demo)");
}

function showAdmin(){
    document.getElementById("admin").style.display="block";
}

function addProduct(){
    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;
    products.push({name,price});
    render();
}
</script>

</body>
</html>
